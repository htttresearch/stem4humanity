[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algofinder"
version = "0.0.1"
description = "algofinder step 0.0.1: an algorithm finder for classic CS problems with exact, heuristic, and ML solvers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "networkx>=2.8",
    "duckdb>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
numba = ["numba>=0.58"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["algofinder*"]
